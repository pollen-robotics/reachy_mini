[pytest]
# Standalone copy of the markers this suite uses. tests/hardware/ is meant to be
# runnable after being copied to a robot on its own, where pyproject.toml (and so
# [tool.pytest.ini_options]) is absent — pip installs src/ only.
addopts = --strict-markers
markers =
    audio: mark test as requiring audio hardware
    respeaker: mark test as requiring the physical ReSpeaker/XMOS audio board
